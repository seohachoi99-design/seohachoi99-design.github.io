<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테스트용</title>
<meta name="theme-color" content="#2f5bd3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="테스트용">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f5bd3; --accent-soft: #e9efff; --ok: #188038; --ok-soft: #e6f4ea;
    --warn: #b06000; --warn-soft: #fef3e0; --bad: #c5221f; --bad-soft: #fce8e6; --gray-soft: #eceff3;
    --auto: #6a4fb3; --auto-soft: #f0ebfb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 16px 0; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .firm { color: var(--muted); font-size: 13px; }
  h1 { margin: 2px 0 12px; font-size: 21px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 10px 12px; font: inherit; color: var(--muted);
    border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px;
    background: var(--bad); color: #fff; font-size: 12px; margin-left: 4px; }
  main { padding: 16px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .chip.done { background: var(--ok-soft); color: var(--ok); }
  .chip.closed, .chip.fee { background: var(--gray-soft); color: var(--muted); }
  .chip.auto { background: var(--auto-soft); color: var(--auto); }
  .chip.wait { background: var(--warn-soft); color: var(--warn); }
  .desc { font-weight: 600; margin: 8px 0 2px; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 700; }
  .q { color: var(--muted); font-size: 14px; margin: 4px 0 10px; line-height: 1.5; }
  .answers { display: flex; gap: 6px; flex-wrap: wrap; }
  .answers button { flex: 1; min-width: 80px; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; font: inherit; cursor: pointer; }
  .answers button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  textarea, input[type=text], select { width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  textarea { min-height: 40px; resize: vertical; }
  .rulebox { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .rulebox input { width: 18px; height: 18px; margin: 0; }
  .save { margin-top: 8px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--ink);
    color: #fff; font: inherit; cursor: pointer; }
  .save:disabled { opacity: .4; cursor: default; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
  .drop { display: block; border: 2px dashed #b8c2d6; border-radius: 12px; background: var(--card); padding: 32px 16px;
    text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .primary { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .primary:disabled { opacity: .5; }
  .ghost { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--bad); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.d { white-space: nowrap; color: var(--muted); }
  tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat .label { color: var(--muted); font-size: 13px; } .stat .val { font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .filters select { margin-top: 0; }
  .ruleform { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 6px; align-items: end; }
  .ruleform input, .ruleform select { margin-top: 0; }
  .ruleform button { padding: 8px 12px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font: inherit; cursor: pointer; }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); } .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg.warn { background: var(--warn-soft); color: var(--warn); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; z-index: 10; }
  #bizSel { width: auto; min-width: 180px; margin: 0 0 10px; font-weight: 600; }
  #setup { max-width: 460px; margin: 60px auto; padding: 0 16px; }
  #setup h1 { margin-bottom: 4px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
  @media (max-width: 560px) { .ruleform { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="setup" hidden>
  <div class="firm">회계법인 아성</div>
  <h1>거래처 자료확인</h1>
  <p class="note">아성에서 받으신 <b>전용 링크</b>를 아래에 붙여넣어 주세요. 이 기기에서 처음 한 번만 하면 됩니다.</p>
  <input type="text" id="keyInput" placeholder="https://…?k=…  또는 접속키">
  <button class="primary" id="keySave">시작하기</button>
  <div id="keyMsg"></div>
</div>

<div id="app" hidden>
<header><div class="wrap">
  <div class="firm" id="firmName">회계법인 아성</div>
  <h1 id="clientName">&nbsp;</h1>
  <select id="bizSel" hidden aria-label="사업장 선택"></select>
  <nav>
    <button data-tab="req" class="on">확인 요청<span id="badge"></span></button>
    <button data-tab="all">전체 거래</button>
    <button data-tab="up">자료 올리기</button>
    <button data-tab="sum">현황·규칙</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="tab-req" class="on"><div id="reqList" class="empty">불러오는 중…</div></section>

  <section id="tab-all"><div id="allBox" class="empty">불러오는 중…</div></section>

  <section id="tab-up">
    <label class="drop" id="drop">
      <strong>은행·경리나라 엑셀을 여기에 끌어다 놓으세요</strong>
      <span class="note">또는 눌러서 파일 선택 (.xlsx · .xls · .csv)</span>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </label>
    <p class="note">이미 올린 거래는 자동으로 빠지니, 기간이 겹쳐도 그대로 올리셔도 됩니다.<br>
      자동 분류 규칙에 맞는 거래는 질문 없이 정리됩니다. 원본 파일은 보관되지 않고 거래 내역만 저장됩니다.</p>
    <div id="preview"></div>
  </section>

  <section id="tab-sum"><div id="sumBox" class="empty">불러오는 중…</div></section>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw5nAQnIgZcRBvV22U8i3Qa96gWTYMVPDy_-bVtaXu4rEB3I1KTT8fwMVF3Rxw-nuXt/exec';
const KEY_STORE = 'asung_confirm_key';
let TOKEN = '';
let KEYS = [];        // 이 기기에 저장된 사업장 접속키들
let NAMES = {};       // 접속키 → 사업장명 (화면 표시용)
let DEADLINE = 7;
const ANSWERS = ['확인', '수정필요', '모름'];
const CLOSED = '무회신-초안확정';
let DATA = { items: [], ledger: [], rules: [] };
let PARSED = null;
let ALL_MONTH = '', ALL_TYPE = '';

/* ── 공통 ── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => (n == null || n === '') ? '-' : Math.round(Number(n)).toLocaleString('ko-KR');
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2500); }
// 구글시트(Apps Script)로 요청 보내기
async function call(fn, ...args) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: fn, args }),
  });
  if (!res.ok) throw new Error('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '요청 실패');
  return j.data;
}

/* ── 접속키: 링크로 처음 열면 이 기기에 저장, 이후엔 아이콘만 눌러도 열림 ──
 * 한 링크에 여러 사업장을 넣을 수 있음:  ?k=키1,키2,키3
 */
function storeLoad() {
  try {
    const raw = localStorage.getItem(KEY_STORE) || '';
    if (!raw) return;
    if (raw.startsWith('{')) {
      const o = JSON.parse(raw);
      KEYS = Array.isArray(o.keys) ? o.keys : []; NAMES = o.names || {};
      TOKEN = KEYS.includes(o.cur) ? o.cur : (KEYS[0] || '');
    } else { KEYS = [raw]; TOKEN = raw; }   // 예전 형식(접속키 1개)
  } catch (e) {}
}
function storeSave() {
  try {
    KEYS.length ? localStorage.setItem(KEY_STORE, JSON.stringify({ keys: KEYS, names: NAMES, cur: TOKEN }))
                : localStorage.removeItem(KEY_STORE);
  } catch (e) {}
}
function extractKeys(text) {
  const s = String(text || '').trim();
  const m = s.match(/[?&]k=([A-Za-z0-9,]+)/);
  const raw = m ? m[1] : s;
  return [...new Set(raw.split(/[\s,]+/).filter(k => /^[A-Za-z0-9]{16,}$/.test(k)))];
}
function addKeys(list) {
  list.forEach(k => { if (!KEYS.includes(k)) KEYS.push(k); });
  if (list.length) TOKEN = list[0];
  storeSave();
}
function removeKey(k) {
  KEYS = KEYS.filter(x => x !== k); delete NAMES[k];
  if (TOKEN === k) TOKEN = KEYS[0] || '';
  storeSave();
}
function renderBizSel() {
  const sel = $('#bizSel');
  if (KEYS.length < 2) { sel.hidden = true; return; }
  sel.hidden = false;
  sel.innerHTML = KEYS.map(k => `<option value="${esc(k)}" ${k === TOKEN ? 'selected' : ''}>${esc(NAMES[k] || '불러오는 중…')}</option>`).join('');
}
function resetView() {
  PARSED = null; ALL_MONTH = ''; ALL_TYPE = '';
  $('#preview').innerHTML = '';
  ['#reqList', '#allBox', '#sumBox'].forEach(id => { $(id).className = 'empty'; $(id).textContent = '불러오는 중…'; });
  showTab('req');
}
$('#bizSel').onchange = e => { TOKEN = e.target.value; storeSave(); resetView(); load(); };
// 다른 사업장 이름 미리 불러오기 (드롭다운 표시용)
async function loadNames() {
  for (const k of KEYS) {
    if (NAMES[k]) continue;
    try { const d = await call('getClientData', k); NAMES[k] = d.clientName || '사업장'; }
    catch (e) { if (String(e.message || e).includes('접근 권한')) removeKey(k); }
  }
  storeSave(); renderBizSel();
}
function showSetup(msg) {
  $('#app').hidden = true; $('#setup').hidden = false;
  $('#keyMsg').innerHTML = msg ? `<div class="msg bad">${esc(msg)}</div>` : '';
}
function showApp() { $('#setup').hidden = true; $('#app').hidden = false; renderBizSel(); }
$('#keySave').onclick = () => {
  const ks = extractKeys($('#keyInput').value);
  if (!ks.length) { $('#keyMsg').innerHTML = '<div class="msg bad">링크나 접속키 형식이 올바르지 않습니다.</div>'; return; }
  addKeys(ks); $('#keyInput').value = ''; showApp(); load(); loadNames();
};
function start() {
  storeLoad();
  const fromUrl = extractKeys(location.search);
  if (fromUrl.length) {
    addKeys(fromUrl);
    history.replaceState(null, '', location.pathname);  // 주소창에서 접속키 숨기기
  }
  if (!TOKEN) { showSetup(''); return; }
  showApp(); load(); loadNames();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'tab-' + b.dataset.tab));
});
function showTab(t) { document.querySelector(`nav button[data-tab="${t}"]`).click(); }
const isClosed = x => x.status === CLOSED;
const isOpen = x => !x.answer && !isClosed(x);
const dirOf = t => (t.deposit > 0 && t.withdraw === 0) ? '입금' : '출금';
const dayOf = date => date.slice(5, 10).replace('-', '/');
function chipClass(type) {
  if (type.startsWith('자동·')) return 'auto';
  if (type === '수수료') return 'fee';
  return '';
}

/* ── 데이터 불러오기 ── */
async function load() {
  try {
    DATA = await call('getClientData', TOKEN);
    if (DATA.clientName) {
      $('#clientName').textContent = DATA.clientName; document.title = DATA.clientName + ' · 테스트용';
      if (NAMES[TOKEN] !== DATA.clientName) { NAMES[TOKEN] = DATA.clientName; storeSave(); renderBizSel(); }
    }
    if (DATA.firm) $('#firmName').textContent = DATA.firm;
    if (DATA.deadline) DEADLINE = DATA.deadline;
    DATA.ledger = DATA.ledger.map((r, i) => ({ ...r, i })).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.i - b.i);
    renderReq(); renderAll(); renderSum();
  } catch (e) {
    const m = (e && e.message) || String(e);
    if (m.includes('접근 권한')) {
      const bad = NAMES[TOKEN]; removeKey(TOKEN);
      if (TOKEN) { toast(`${bad || '한 사업장'} 링크가 만료되어 목록에서 뺐습니다`); renderBizSel(); resetView(); load(); return; }
      showSetup('링크가 만료되었거나 올바르지 않습니다. 아성에서 받은 새 링크를 붙여넣어 주세요.'); return;
    }
    $('#reqList').className = '';
    $('#reqList').innerHTML = `<div class="msg bad">${esc(m)}</div>`;
  }
}

// 원장 거래 ↔ 확인요청 연결 (거래키 우선, 없으면 내용 문구로)
function descOf(t) {
  const who = t.party || '(내용없음)';
  return dirOf(t) === '입금' ? `${dayOf(t.date)} ${who} 입금 ${won(t.deposit)}` : `${dayOf(t.date)} ${who} 출금 ${won(t.withdraw)}`;
}
function reqMaps() {
  const byKey = {}, byDesc = {};
  DATA.items.forEach(x => { if (x.key) byKey[x.key] = x; byDesc[x.desc] = x; });
  return { byKey, byDesc };
}
function partyOfItem(x) {
  if (x.party) return x.party;
  const hit = DATA.ledger.find(t => descOf(t) === x.desc);
  return hit ? hit.party : '';
}

/* ── ① 확인 요청 ── */
function renderReq() {
  const items = DATA.items.slice().reverse();
  const open = items.filter(isOpen), done = items.filter(x => !isOpen(x));
  $('#badge').innerHTML = open.length ? `<span class="badge">${open.length}</span>` : '';
  if (!items.length) { $('#reqList').className = 'empty'; $('#reqList').textContent = '확인할 항목이 없습니다.'; return; }
  $('#reqList').className = '';
  $('#reqList').innerHTML =
    `<div class="note">매월 ${DEADLINE}일까지 답변이 없는 항목은 통장 내역 기준 초안대로 처리됩니다.</div>` +
    `<h2>답변 필요 (${open.length})</h2>` + (open.map(card).join('') || '<div class="empty">모두 답변하셨습니다 👍</div>') +
    (done.length ? `<h2>완료 (${done.length})</h2>` + done.map(card).join('') : '');
  document.querySelectorAll('.card[data-row]').forEach(bindCard);
}

function card(x) {
  const closed = isClosed(x);
  const party = partyOfItem(x);
  const dir = x.desc.includes(' 입금 ') ? '입금' : '출금';
  const chip = closed ? '<span class="chip closed">마감·초안확정</span>' : x.answer ? '<span class="chip done">답변완료</span>' : `<span class="chip">${esc(x.type)}</span>`;
  return `<div class="card" data-row="${x.row}" data-desc="${esc(x.desc)}" data-answer="${esc(x.answer)}" data-party="${esc(party)}" data-dir="${dir}">
    <div class="row">${chip}<span class="note">${esc(x.month)}</span></div>
    <div class="row"><div class="desc">${esc(x.desc)}</div><div class="amt">${won(x.amount)}원</div></div>
    <div class="q">${esc(x.memo)}</div>
    ${closed ? '' : `<div class="answers">${ANSWERS.map(a => `<button type="button" class="${x.answer === a ? 'sel' : ''}">${a}</button>`).join('')}</div>
    <textarea placeholder="수정할 내용이나 설명 (선택)">${esc(x.detail)}</textarea>
    ${party.length >= 2 ? `<label class="rulebox"><input type="checkbox" class="rule-on"> 앞으로 '${esc(party)}' ${dir}은 묻지 않고 자동 분류</label>
    <input type="text" class="rule-label" placeholder="분류 이름 (예: 급여, 임대료, 외주비)" maxlength="30" hidden>` : ''}
    <button type="button" class="save" disabled>저장</button>`}
  </div>`;
}

function bindCard(el) {
  const save = el.querySelector('.save');
  if (!save) return;
  const btns = el.querySelectorAll('.answers button');
  const ta = el.querySelector('textarea');
  const ruleOn = el.querySelector('.rule-on'), ruleLabel = el.querySelector('.rule-label');
  let pick = el.dataset.answer;
  const dirty = () => { save.disabled = !pick; };
  btns.forEach(b => b.onclick = () => { pick = b.textContent; btns.forEach(x => x.classList.toggle('sel', x === b)); dirty(); });
  ta.oninput = dirty;
  if (ruleOn) ruleOn.onchange = () => { ruleLabel.hidden = !ruleOn.checked; if (ruleOn.checked) ruleLabel.focus(); dirty(); };
  save.onclick = async () => {
    const wantRule = ruleOn && ruleOn.checked;
    const label = wantRule ? ruleLabel.value.trim() : '';
    if (wantRule && !label) { toast('자동 분류할 이름을 적어주세요 (예: 급여)'); ruleLabel.focus(); return; }
    save.disabled = true; save.textContent = '저장 중…';
    try {
      await call('saveAnswer', TOKEN, Number(el.dataset.row), el.dataset.desc, pick, ta.value);
      if (wantRule) await call('addRule', TOKEN, el.dataset.party, label, el.dataset.dir);
      toast(wantRule ? '저장했습니다 · 다음 업로드부터 자동 분류됩니다' : '저장했습니다');

/* ── ③ 엑셀 읽기 ── */
const ALIASES = {
  date: ['거래일시', '거래일자', '거래일', '일자'],
  summary: ['적요', '거래구분', '구분'],
  deposit: ['입금액', '입금', '맡기신금액'],
  withdraw: ['출금액', '출금', '찾으신금액'],
  party: ['내용', '거래내용', '받는분', '보낸분', '거래처', '기재내용'],
  balance: ['잔액', '거래후잔액'],
};
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
$('#file').addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ''; });

function handleFile(file) {
  if (/\.pdf$/i.test(file.name)) { $('#preview').innerHTML = '<div class="msg bad">PDF는 올릴 수 없습니다. 은행·경리나라에서 엑셀로 내려받아 주세요.</div>'; return; }
  const fr = new FileReader();
  fr.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
      PARSED = parseSheet(wb.Sheets[wb.SheetNames[0]], DATA.rules);
      renderPreview(file.name);
    } catch (err) {
      $('#preview').innerHTML = `<div class="msg bad">${esc(err.message || err)}</div>`;
    }
  };
  fr.readAsArrayBuffer(file);
}

const clean = v => v == null ? '' : String(v).trim();
const num = v => { if (v == null || v === '') return 0; const n = Math.round(Number(String(v).replace(/,/g, ''))); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
function toDate(v) {
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())} ${pad(v.getHours())}:${pad(v.getMinutes())}:${pad(v.getSeconds())}`;
  const m = clean(v).match(/^(\d{4})[.\-\/]?(\d{1,2})[.\-\/]?(\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return null;
  return `${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4] || 0)}:${pad(m[5] || 0)}:${pad(m[6] || 0)}`;
}

function parseSheet(ws, rules) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  let hdr = -1, col = {};
  for (let r = 0; r < Math.min(rows.length, 30); r++) {
    const names = (rows[r] || []).map(clean), map = {};
    for (const [k, al] of Object.entries(ALIASES)) { const i = names.findIndex(n => al.includes(n)); if (i >= 0) map[k] = i; }
    if ('date' in map && 'withdraw' in map && 'deposit' in map) { hdr = r; col = map; break; }
  }
  if (hdr < 0) throw new Error('거래일시·입금액·출금액 열을 찾지 못했습니다. 은행에서 내려받은 거래내역 엑셀인지 확인해 주세요.');

  const g = (row, k) => k in col ? row[col[k]] : null;
  const txs = [];
  rows.slice(hdr + 1).forEach((row, i) => {
    const date = toDate(g(row, 'date'));
    if (!date) return;
    txs.push({ src: i, date, summary: clean(g(row, 'summary')), party: clean(g(row, 'party')),
      deposit: num(g(row, 'deposit')), withdraw: num(g(row, 'withdraw')),
      balance: 'balance' in col && clean(g(row, 'balance')) !== '' ? num(g(row, 'balance')) : null });
  });
  if (!txs.length) throw new Error('거래 내역이 없습니다.');

  const desc = txs[0].date >= txs[txs.length - 1].date;
  txs.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (desc ? b.src - a.src : a.src - b.src));

  let errors = 0;
  txs.forEach((t, i) => {
    if (i > 0 && t.balance != null && txs[i - 1].balance != null) {
      if (txs[i - 1].balance + t.deposit - t.withdraw !== t.balance) { t.balErr = true; errors++; }
    }
    Object.assign(t, classify(t, rules || []));
  });
  return { txs, errors };
}

/* ── 자동 분류 ── */
const trunc10 = x => Math.floor(x / 10) * 10;
function netAfter(g, rate) { const it = trunc10(Math.floor(g * rate / 100)); const lt = trunc10(Math.floor(it / 10)); return [g - it - lt, it, lt]; }
function findGross(net, rate) {
  const guess = Math.round(net / (1 - rate * 1.1 / 100));
  for (let g = Math.floor((guess - 3000) / 1000) * 1000; g < guess + 3000; g += 1000) {
    if (g <= 0) continue; const r = netAfter(g, rate); if (r[0] === net) return [g, r[1], r[2]];
  }
  return null;
}
function findSupply(t) {
  const guess = Math.round(t / 1.1);
  for (let s = guess - 2; s <= guess + 2; s++) if (s > 0 && s % 100 === 0 && s + Math.floor(s / 10) === t) return [s, Math.floor(s / 10)];
  return null;
}
function matchRule(t, rules) {
  const dir = dirOf(t);
  return rules.find(r => (r.dir === '전체' || r.dir === dir) && r.match.length >= 2 && (t.party.includes(r.match) || t.summary.includes(r.match)));
}
function classify(t, rules) {
  const w = t.withdraw, d = t.deposit, who = t.party || '(내용없음)', day = dayOf(t.date);
  const base = `${day} ${who} 출금 ${won(w)}`;
  if (w > 0 && w <= 5000 && t.summary.includes('수수')) return { type: '수수료', amount: w, desc: `${day} 이체수수료 ${won(w)}`, question: '', auto: false };
  const rule = matchRule(t, rules);
  if (rule) {
    const isDep = dirOf(t) === '입금';
    return { type: '자동·' + rule.label, amount: isDep ? d : w, desc: isDep ? `${day} ${who} 입금 ${won(d)}` : base, question: '', auto: true };
  }
  if (d > 0 && w === 0) return { type: '입금확인', amount: d, desc: `${day} ${who} 입금 ${won(d)}`, question: '어떤 대금 입금인가요? (매출·대여금 회수·가수금 등)', auto: false };
  const h3 = findGross(w, 3), v = findSupply(w);
  if (h3 && v) return { type: '매입/사업소득 구분', amount: w, desc: base, question: `① 공급가 ${won(v[0])} + 부가세 ${won(v[1])} 매입 건인가요, ② 사업소득 ${won(h3[0])}원(3.3% 공제) 지급인가요?`, auto: false };
  if (h3) return { type: '사업소득(추정)', amount: h3[0], desc: base, question: `사업소득 총지급액 ${won(h3[0])}원(소득세 ${won(h3[1])}, 지방세 ${won(h3[2])} 공제 후 지급) 맞나요? 받는 분 인적사항이 처음이면 알려주세요.`, auto: false };
  const h8 = findGross(w, 8);
  if (h8) return { type: '기타소득(추정)', amount: h8[0], desc: base, question: `기타소득 총지급액 ${won(h8[0])}원(8.8% 공제 후 지급) 맞나요?`, auto: false };
  if (v) return { type: '매입(VAT포함 추정)', amount: w, desc: base, question: `공급가 ${won(v[0])} + 부가세 ${won(v[1])} 매입 건으로 보입니다. 세금계산서(또는 카드) 받으셨나요? 품목은?`, auto: false };
  return { type: '용도확인', amount: w, desc: base, question: '어떤 용도의 지급인가요? (급여·대표 가지급·거래처 대금 등)', auto: false };
}

function renderPreview(name) {
  const { txs, errors } = PARSED;
  const reqs = txs.filter(t => !t.auto && t.type !== '수수료');
  const autoN = txs.filter(t => t.auto).length, feeN = txs.filter(t => t.type === '수수료').length;
  $('#preview').innerHTML = `<div class="card">

    <p class="note">거래 ${txs.length}건 → 질문 ${reqs.length}건 · 자동 분류 ${autoN}건 · 수수료 ${feeN}건</p>
    ${errors ? `<div class="msg warn">잔액이 앞뒤 거래와 맞지 않는 줄이 ${errors}건 있습니다. 중간 거래가 빠진 파일일 수 있어요.</div>` : '<div class="msg ok">잔액 연속성 이상 없음</div>'}
    <div class="scroll"><table><tr><th>구분</th><th>내용</th><th class="n">금액</th></tr>
      ${reqs.slice(0, 15).map(t => `<tr><td>${esc(t.type)}</td><td>${esc(t.desc)}</td><td class="n">${won(t.amount)}</td></tr>`).join('')}
      ${reqs.length > 15 ? `<tr><td colspan="3" class="note">외 ${reqs.length - 15}건</td></tr>` : ''}
    </table></div>
    <button class="primary" id="go">올리기</button>
  </div>`;
  $('#go').onclick = upload;
}

async function upload() {
  const btn = $('#go'); btn.disabled = true; btn.textContent = '올리는 중…';
  try {
    const payload = PARSED.txs.map(({ date, summary, party, deposit, withdraw, balance, type, amount, desc, question, auto }) =>
      ({ date, summary, party, deposit, withdraw, balance, type, amount, desc, question, auto }));
    const r = await call('uploadTransactions', TOKEN, payload);
    $('#preview').innerHTML = `<div class="msg ok">새 거래 ${r.added}건 저장 · 이미 있던 거래 ${r.dup}건 제외 · 확인요청 ${r.requests}건 추가 · 자동 분류 ${r.auto}건</div>`;
    PARSED = null; await load();
    showTab(r.requests ? 'req' : 'all');
  } catch (e) {
    btn.disabled = false; btn.textContent = '올리기';
    toast(e.message || '업로드 실패');
  }
}

start();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
